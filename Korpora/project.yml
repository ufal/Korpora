name: Korpora
options:
  bundleIdPrefix: cz.cuni.mff.ufal
  # Deliberately the local macOS version, not the oldest the code could
  # support (it builds fine at 13.0 - verified 2026-09-09 - since nothing
  # here needs newer API; NSTableViewDiffableDataSource at macOS 11 is the
  # real floor). Matching the local OS is what keeps the ~41 "object file
  # was built for newer macOS version than being linked" linker warnings
  # silent, and this app is dev-only on a single machine, so that trade is
  # worth it here.
  #
  # Consequence to be aware of: a deployment target can't exceed the SDK,
  # so this pins *building the app* to the newest Xcode. It doesn't
  # restrict the engine - `KorporaEngine` declares `.macOS(.v13)` and builds
  # and tests standalone (`swift build`/`swift test`) on older systems.
  # Anyone on an older Xcode who needs the app can override per build:
  #
  #   xcodebuild ... MACOSX_DEPLOYMENT_TARGET=13.0
  #
  # See docs/project-plan.md's "Deployment target / minimum toolchain".
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  KorporaEngine:
    path: ../KorporaEngine

targets:
  Korpora:
    type: application
    platform: macOS
    sources:
      - path: Korpora
      # Only the Icon Composer bundle ships; the rest of AppIcon/ (layer
      # SVGs, make_layers.py, preview.svg) is its editable source.
      - path: AppIcon/Korpora.icon
        buildPhase: resources
    dependencies:
      - package: KorporaEngine
        product: KorporaEngine
    # Bundle pando into the app for release builds: `libpando.dylib` into
    # Contents/Frameworks (the engine loads it with dlopen) and `pando-index`
    # into Contents/Helpers (corpus import). Gated on PANDO_BUILD_DIR so dev
    # builds - which find the libpando built by scripts/pando-spike.sh at run
    # time - are unchanged. scripts/build-release-deps.sh builds pando and
    # prints the variable to export.
    postCompileScripts:
      - name: Bundle pando
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${PANDO_BUILD_DIR:-}" ]; then
            echo "PANDO_BUILD_DIR unset - not bundling pando (dev build finds it at runtime)"
            exit 0
          fi
          app="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents"
          mkdir -p "${app}/Helpers" "${app}/Frameworks"
          # Nested code must be signed before the enclosing app (inside-out),
          # with the same identity and hardened runtime - Xcode's own CodeSign
          # step only signs the app itself. Never `codesign --deep` to sign.
          sign_flags="--force --options runtime"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
            sign_flags="$sign_flags --timestamp"
          fi
          cp "${PANDO_BUILD_DIR}/pando-index" "${app}/Helpers/pando-index" || exit 1
          # The real file, named libpando.dylib (the build's symlinks point at a versioned name).
          cp -L "${PANDO_BUILD_DIR}/libpando.dylib" "${app}/Frameworks/libpando.dylib" || exit 1
          chmod +x "${app}/Helpers/pando-index"
          for item in "${app}/Helpers/pando-index" "${app}/Frameworks/libpando.dylib"; do
            if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              # Retried: --timestamp depends on Apple's timestamp server.
              signed=no
              for attempt in 1 2 3; do
                if codesign $sign_flags --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${item}"; then
                  signed=yes; break
                fi
                echo "codesign ${item} failed (attempt ${attempt}/3)"
                sleep 5
              done
              [ "$signed" = yes ] || exit 1
            fi
          done
          echo "Bundled pando from ${PANDO_BUILD_DIR}"
    settings:
      base:
        # Was cz.cuni.mff.ufal.mac-corpora.dev until the first release;
        # settings stored under the old id are carried over once at launch
        # by LegacyDefaultsMigration (main.swift).
        PRODUCT_BUNDLE_IDENTIFIER: cz.cuni.mff.ufal.korpora
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Korpora/Info.plist
        CODE_SIGN_ENTITLEMENTS: Korpora/Korpora.entitlements
        # Names AppIcon/Korpora.icon (an Icon Composer icon is named by its
        # file); actool also derives the pre-macOS 26 .icns from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: Korpora
      # Distribution build: notarizable Developer ID signing (docs/
      # project-plan.md, "Goal - Ship a signed GitHub release", step 4).
      # Debug keeps Automatic signing and the 27.0 dev target above.
      #  - macOS 15 is the release floor (blocker-3 decision); the release
      #    deps script builds pando at the same floor.
      #  - arm64 only: the bundled pando is arm64-only.
      #  - Hardened runtime on; sandbox stays off (entitlements file).
      configs:
        Release:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          ARCHS: arm64
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          DEVELOPMENT_TEAM: 8YW3ZU8MFU
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # Strip the shipped binary. STRIP_INSTALLED_PRODUCT/STRIP_STYLE
          # are already on, but Xcode only strips when deployment
          # postprocessing is on, which `archive` sets and the plain
          # `build` scripts/make-release.sh runs does not. Symbols stay
          # recoverable from the dSYM (dwarf-with-dsym), so keep it per
          # release.
          DEPLOYMENT_POSTPROCESSING: YES
          DEAD_CODE_STRIPPING: YES
          # Otherwise Xcode injects com.apple.security.get-task-allow on a
          # plain `build` (only `archive` strips it), and the notary service
          # rejects the app outright.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  KorporaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KorporaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Korpora.app/Contents/MacOS/Korpora"
    dependencies:
      - target: Korpora

schemes:
  Korpora:
    build:
      targets:
        Korpora: all
        KorporaTests: [test]
    run:
      config: Debug
      environmentVariables:
        # Where Xcode runs find pando: the build scripts/pando-spike.sh makes
        # (a release app bundles its own).
        KORPORA_PANDO_LIB: "$(HOME)/Developer/pando-work/pando/build/libpando.dylib"
        KORPORA_PANDO_INDEX: "$(HOME)/Developer/pando-work/pando/build/pando-index"
    test:
      config: Debug
      targets:
        - KorporaTests
